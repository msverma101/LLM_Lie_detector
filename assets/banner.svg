<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14121f"/>
      <stop offset="1" stop-color="#1f1b33"/>
    </linearGradient>
    <linearGradient id="lie" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>

  <!-- neural net (left) -->
  <g stroke="#3b3758" stroke-width="1.5">
    <line x1="80" y1="90" x2="170" y2="70"/><line x1="80" y1="90" x2="170" y2="160"/><line x1="80" y1="90" x2="170" y2="250"/>
    <line x1="80" y1="160" x2="170" y2="70"/><line x1="80" y1="160" x2="170" y2="160"/><line x1="80" y1="160" x2="170" y2="250"/>
    <line x1="80" y1="230" x2="170" y2="70"/><line x1="80" y1="230" x2="170" y2="160"/><line x1="80" y1="230" x2="170" y2="250"/>
    <line x1="170" y1="70" x2="260" y2="115"/><line x1="170" y1="160" x2="260" y2="115"/><line x1="170" y1="250" x2="260" y2="115"/>
    <line x1="170" y1="70" x2="260" y2="205"/><line x1="170" y1="160" x2="260" y2="205"/><line x1="170" y1="250" x2="260" y2="205"/>
  </g>
  <!-- highlighted "lie direction" path -->
  <polyline points="80,160 170,250 260,205" fill="none" stroke="url(#lie)" stroke-width="4" stroke-linecap="round"/>
  <g fill="#2a2645" stroke="#6d6a8f" stroke-width="2">
    <circle cx="80" cy="90" r="13"/><circle cx="80" cy="230" r="13"/>
    <circle cx="170" cy="70" r="13"/><circle cx="170" cy="160" r="13"/>
    <circle cx="260" cy="115" r="13"/>
  </g>
  <circle cx="80" cy="160" r="13" fill="#5eead4"/>
  <circle cx="170" cy="250" r="13" fill="#a3c98a"/>
  <circle cx="260" cy="205" r="13" fill="#f59e0b"/>

  <!-- probe "scanner" -->
  <g transform="translate(300,170)">
    <path d="M0,0 L36,0" stroke="#f59e0b" stroke-width="3" stroke-dasharray="5 5"/>
    <rect x="40" y="-30" width="60" height="60" rx="12" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <text x="70" y="8" text-anchor="middle" font-size="22" font-weight="700" fill="#f59e0b">?!</text>
  </g>

  <!-- title -->
  <text x="450" y="120" font-size="54" font-weight="800" fill="#f5f3ff">LLM Lie Detector</text>
  <text x="452" y="168" font-size="24" fill="#c4c0e0">Catching knowing falsehoods in activations and weights</text>

  <!-- tags -->
  <g font-size="17" font-weight="600">
    <rect x="452" y="205" width="170" height="36" rx="18" fill="#123b38"/>
    <text x="537" y="229" text-anchor="middle" fill="#5eead4">FIBS probes</text>
    <rect x="636" y="205" width="270" height="36" rx="18" fill="#3d2c0c"/>
    <text x="771" y="229" text-anchor="middle" fill="#fbbf24">Weight-space programming</text>
    <rect x="920" y="205" width="230" height="36" rx="18" fill="#2e2552"/>
    <text x="1035" y="229" text-anchor="middle" fill="#c4b5fd">Claude Impact Lab 2026</text>
  </g>
  <text x="452" y="285" font-size="16" fill="#8a86a8">Status: discovery phase · everything open for discussion</text>
</svg>
